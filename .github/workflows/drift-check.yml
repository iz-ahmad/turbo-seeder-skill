name: "Drift Check"

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: drift-check
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout skill
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Resolve latest package release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/iz-ahmad/laravel-turbo-seeder/releases/latest --jq .tag_name) || tag=""

          if [ -z "$tag" ]; then
            echo "::error::No published release found for iz-ahmad/laravel-turbo-seeder"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout package at the latest release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: iz-ahmad/laravel-turbo-seeder
          ref: ${{ steps.release.outputs.tag }}
          path: package
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'

      - name: Compare generated signatures
        id: signatures
        run: |
          set +e
          php scripts/generate-api.php --package=package --check
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Open an issue on drift
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.release.outputs.tag }}
          CODE: ${{ steps.signatures.outputs.code }}
        run: |
          stamps=$(grep -rhoP 'erified against.* v\K[0-9]+\.[0-9]+\.[0-9]+' skills README.md | sort -u)

          if [ "$CODE" = "0" ] && [ "$stamps" = "${LATEST#v}" ]; then
            echo "In sync with $LATEST."
            exit 0
          fi

          case "$CODE" in
            0) reason="signatures match, but the verified version stamp is out of date" ;;
            1) reason="generated signatures differ from the package" ;;
            *) reason="the generator failed (exit $CODE); see the workflow run" ;;
          esac

          gh label create drift --color D93F0B --description "Skill is out of sync with the package" 2>/dev/null || true

          if [ -n "$(gh issue list --label drift --state open --json number --jq '.[0].number')" ]; then
            echo "A drift issue is already open."
            exit 0
          fi

          gh issue create \
            --label drift \
            --title "Re-verify skill against laravel-turbo-seeder $LATEST" \
            --body "Latest package release: \`$LATEST\`. Stamped versions found: \`$(echo $stamps)\`. Reason: $reason. Run \`php scripts/generate-api.php --package=<path>\`, review the release notes for behaviour changes, update the hand-written references, then bump the verified version in SKILL.md, README.md and each reference file."
